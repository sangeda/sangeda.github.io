name: OpenAlex lookup (read-only helper)

# Runs only on the openalex-lookups branch, never on main: it does not build
# or deploy the site and does not touch the Observatory snapshot. Push a file
# of DOIs / OpenAlex work ids to lookups/ and the full records are attached to
# the pre-release "openalex-lookups" (marked pre-release so it never shows as
# the latest Observatory snapshot), and kept as a run artifact.

on:
  push:
    branches: [openalex-lookups]
    paths:
      - "lookups/*.txt"
      - "scripts/openalex_lookup.py"
      - ".github/workflows/openalex-lookup.yml"

permissions:
  contents: write

concurrency:
  group: openalex-lookup
  cancel-in-progress: false

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fetch every lookups/*.txt list
        run: |
          shopt -s nullglob
          for f in lookups/*.txt; do
            echo "== $f"
            python scripts/openalex_lookup.py "$f" --out lookup_out
          done
      - name: Attach results to the openalex-lookups pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view openalex-lookups >/dev/null 2>&1; then
            gh release create openalex-lookups --target openalex-lookups --prerelease \
              --title "OpenAlex lookups (helper, not an Observatory snapshot)" \
              --notes "Full OpenAlex records fetched by scripts/openalex_lookup.py for the lists in lookups/ on the openalex-lookups branch. Not part of the MUHAS Publications Observatory snapshots."
          fi
          gh release upload openalex-lookups lookup_out/* --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: openalex-lookups
          path: lookup_out/
          retention-days: 30
