name: Update BPharm research catalogue
on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Choose the BPharm catalogue source for this manual run'
        type: choice
        options: [cache, redcap]
        default: redcap
  push:
    branches: [main]
    paths: ['bpharm-projects/**', 'scripts/*bpharm*', '.github/workflows/update-bpharm.yml']
  schedule:
    - cron: '17 2 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: muhas-publications-observatory
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build public catalogue
        env:
          REDCAP_PROJECT224_TOKEN: ${{ secrets.REDCAP_PROJECT224_TOKEN }}
          SOURCE: ${{ inputs.source || 'redcap' }}
        run: python scripts/build_bpharm.py --source "$SOURCE"
      - name: Validate public output
        run: python -m unittest discover -s tests -p 'test_bpharm.py'
      - name: Save successful public refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bpharm-projects
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public BPharm catalogue'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Stage complete site and preserve Observatory downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install -r requirements.txt
          python scripts/stage_dcepd_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
