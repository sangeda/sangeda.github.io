name: Add or update profile record

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Record operation'
        required: true
        type: choice
        options: [add-event, add-student, update-event, update-student]
      record:
        description: 'JSON object containing the public record fields (see docs/PROFILE_RECORDS.md)'
        required: true
        type: string
      record_id:
        description: 'Existing EVT or SUP ID for updates; leave blank when adding'
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: muhas-publications-observatory
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate and save record
        env:
          PROFILE_COMMAND: ${{ inputs.command }}
          PROFILE_RECORD: ${{ inputs.record }}
          PROFILE_RECORD_ID: ${{ inputs.record_id }}
        run: |
          python -m unittest discover -s tests -p 'test_profile_records.py'
          python scripts/profile_records.py "$PROFILE_COMMAND" --id "$PROFILE_RECORD_ID"
          python scripts/build_site_seo.py
      - name: Commit public profile update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/profile supervision events index.html sitemap.xml robots.txt publications.html muhas-publications/index.html bpharm-projects/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Update public supervision and events record'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Stage complete website and preserve Observatory downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install -r requirements.txt
          python scripts/stage_dcepd_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish updated profile
        id: deployment
        uses: actions/deploy-pages@v4
