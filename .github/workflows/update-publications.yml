name: Update publication catalogue

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Query ORCID, Crossref and PubMed
        run: |
          python scripts/update_publications.py
          python scripts/build_publication_topics.py
      - name: Commit updated catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publications.html data/publications.json data/publication_topics.json assets/publication_wordcloud.svg assets/publication_trends.svg index.html muhas-publications/index.html sitemap.xml robots.txt
          git diff --cached --quiet || git commit -m "Update publication catalogue"
          git push

