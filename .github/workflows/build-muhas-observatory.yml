name: Build MUHAS Publications Observatory

# No push trigger: a push-triggered harvest would publish a provisional release
# that outranks the latest final snapshot on the live site. Code changes reach the
# site through deploy-pages.yml; harvests run only on schedule or by hand.
on:
  workflow_dispatch:
    inputs:
      as_of:
        description: "Publication cut-off date (YYYY-MM-DD); blank uses today in Tanzania"
        required: false
        type: string
      status:
        description: "Snapshot status"
        required: true
        default: provisional
        type: choice
        options:
          - provisional
          - final
      publish_release:
        description: "Archive the dated snapshot in a GitHub Release"
        required: true
        default: false
        type: boolean
  schedule:
    # 00:15 East Africa Time on the day after each MUHAS quarter closes.
    - cron: "15 21 31 3,12 *"
    - cron: "15 21 30 6,9 *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: muhas-publications-observatory
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      snapshot_id: ${{ steps.validate.outputs.snapshot_id }}
      as_of: ${{ steps.meta.outputs.as_of }}
      status: ${{ steps.meta.outputs.status }}
      publish_release: ${{ steps.meta.outputs.publish_release }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install export dependency
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Determine snapshot date and status
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_AS_OF: ${{ inputs.as_of }}
          INPUT_STATUS: ${{ inputs.status }}
          INPUT_RELEASE: ${{ inputs.publish_release }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            AS_OF="$(TZ=Africa/Dar_es_Salaam date --date=yesterday +%F)"
            STATUS="final"
            PUBLISH_RELEASE="true"
          else
            AS_OF="${INPUT_AS_OF:-$(TZ=Africa/Dar_es_Salaam date +%F)}"
            STATUS="${INPUT_STATUS:-provisional}"
            PUBLISH_RELEASE="${INPUT_RELEASE:-false}"
          fi
          echo "as_of=$AS_OF" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "publish_release=$PUBLISH_RELEASE" >> "$GITHUB_OUTPUT"
      - name: Fetch the previous final snapshot for comparison
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
          AS_OF: ${{ steps.meta.outputs.as_of }}
        run: |
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq \
            '[.[] | select(.tag_name | test("^muhas-pubs-[0-9-]{10}-final$")) | select(.tag_name[11:21] < env.AS_OF)] | sort_by(.tag_name) | last | .tag_name // empty')
          if [[ -z "$tag" ]]; then echo "No earlier final snapshot to compare with."; exit 0; fi
          mkdir -p "$RUNNER_TEMP/prev"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.jsonl.gz' --dir "$RUNNER_TEMP/prev"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "raw=$(ls "$RUNNER_TEMP"/prev/*.jsonl.gz | head -1)" >> "$GITHUB_OUTPUT"
      - name: Query OpenAlex and build all formats
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          PREV_RAW: ${{ steps.prev.outputs.raw }}
          PREV_TAG: ${{ steps.prev.outputs.tag }}
        run: |
          extra=()
          if [[ -n "$PREV_RAW" ]]; then extra=(--previous-raw "$PREV_RAW" --previous-tag "$PREV_TAG"); fi
          python scripts/build_muhas_observatory.py --as-of "${{ steps.meta.outputs.as_of }}" --status "${{ steps.meta.outputs.status }}" "${extra[@]}"
      - name: Validate generated database
        id: validate
        run: |
          python - <<'PY'
          import json, os, sqlite3
          from pathlib import Path
          manifest = json.loads(Path("muhas-publications/data/snapshot_manifest.json").read_text())
          db = sqlite3.connect("muhas-publications/downloads/MUHAS_Publications_LATEST.sqlite")
          assert db.execute("pragma integrity_check").fetchone()[0] == "ok"
          assert db.execute("select count(*) from works").fetchone()[0] == manifest["works_processed"]
          assert db.execute("select count(*) from authorships").fetchone()[0] == manifest["authorship_rows"]
          print(f"Validated {manifest['works_processed']:,} works and {manifest['authorship_rows']:,} authorships")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"snapshot_id={manifest['snapshot_id']}\n")
          PY
      - name: Report snapshot checks
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          m = json.loads(Path("muhas-publications/data/snapshot_manifest.json").read_text())
          with open("muhas-publications/downloads/MUHAS_Publications_LATEST.csv", encoding="utf-8-sig", newline="") as f:
              works = list(csv.DictReader(f))
          truncated = [w for w in works if w.get("list_authors_truncated") == "True"]
          checks = {
              "works": m["works_processed"],
              "authorship_rows": m["authorship_rows"],
              "refetched_for_full_authorships": m.get("works_refetched_for_full_authorships"),
              "truncated_works_with_muhas_after_99": sum("[MUHAS]" in w.get("authors", "") for w in truncated),
              "max_authors": max((int(w["authors_count"]) for w in works), default=0),
              "works_with_pmid": sum(bool(w.get("pmid")) for w in works),
              "quarterly_report": m.get("quarterly_report"),
              "release_files": sorted(p.name for p in Path("muhas-publications/downloads").glob(m["snapshot_id"] + "*")),
          }
          print("::notice title=Snapshot checks::" + json.dumps(checks))
          if m.get("changes_since_previous"):
              print("::notice title=Changes since previous final::" + json.dumps(m["changes_since_previous"]))
          PY
      - name: Package immutable snapshot
        run: |
          mkdir -p release
          cp muhas-publications/downloads/${{ steps.validate.outputs.snapshot_id }}* release/
          cp muhas_publications_archive/raw/${{ steps.validate.outputs.snapshot_id }}.jsonl.gz release/
          cp muhas-publications/data/snapshot_manifest.json release/${{ steps.validate.outputs.snapshot_id }}_manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.validate.outputs.snapshot_id }}
          path: release/
          retention-days: 90
      - name: Publish immutable GitHub Release
        if: steps.meta.outputs.publish_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: muhas-pubs-${{ steps.meta.outputs.as_of }}-${{ steps.meta.outputs.status }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "MUHAS publications — ${{ steps.meta.outputs.as_of }} (${{ steps.meta.outputs.status }})" --notes "OpenAlex institution I154840374 / ROR 027pr6c67. Publication cut-off: ${{ steps.meta.outputs.as_of }}. Generated by a reproducible GitHub Actions workflow."
          fi
          gh release upload "$TAG" release/* --clobber
      - name: Build BPharm pages and search metadata
        run: |
          python scripts/build_bpharm.py
          python scripts/build_site_seo.py
      - name: Stage website
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude 'release' --exclude 'muhas_publications_archive' ./ _site/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    # Only a published snapshot goes live; test runs build and upload artifacts only.
    if: needs.build.outputs.publish_release == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy generated site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

